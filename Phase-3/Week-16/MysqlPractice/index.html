<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add iPhone Product</title>

    <!-- =========================================
         Bootstrap CSS
    ========================================== -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- =========================================
         Custom CSS
    ========================================== -->
    <style>
      /* ================================
           General Page Styling
        ================================= */

      body {
        background: #f4f7fb;
        font-family: Arial, Helvetica, sans-serif;
        color: #212529;
      }

      /* ================================
           Main Container
        ================================= */

      .main-container {
        max-width: 900px;
        margin: 50px auto;
      }

      /* ================================
           Page Header
        ================================= */

      .page-header {
        background: linear-gradient(135deg, #0d6efd, #084298);

        color: white;

        padding: 35px;

        border-radius: 15px 15px 0 0;

        text-align: center;
      }

      .page-header h1 {
        font-weight: 700;
        margin-bottom: 10px;
      }

      .page-header p {
        margin: 0;
        opacity: 0.9;
      }

      /* ================================
           Form Container
        ================================= */

      .form-container {
        background: white;

        padding: 35px;

        border-radius: 0 0 15px 15px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      /* ================================
           Section Cards
        ================================= */

      .form-section {
        border: 1px solid #dee2e6;

        border-radius: 12px;

        padding: 25px;

        margin-bottom: 25px;

        background: #ffffff;
      }

      .section-title {
        color: #0d6efd;

        font-weight: 700;

        margin-bottom: 20px;

        padding-bottom: 10px;

        border-bottom: 2px solid #e9ecef;
      }

      /* ================================
           Labels
        ================================= */

      .form-label {
        font-weight: 600;

        margin-bottom: 8px;
      }

      /* ================================
           Inputs
        ================================= */

      .form-control {
        border-radius: 8px;

        padding: 11px 14px;
      }

      .form-control:focus {
        border-color: #0d6efd;

        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
      }

      /* ================================
           Textarea
        ================================= */

      textarea.form-control {
        min-height: 120px;

        resize: vertical;
      }

      /* ================================
           Submit Button
        ================================= */

      .submit-btn {
        width: 100%;

        padding: 13px;

        font-size: 18px;

        font-weight: 600;

        border-radius: 8px;
      }

      /* ================================
           Required Mark
        ================================= */

      .required {
        color: red;
      }

      /* ================================
           Footer Text
        ================================= */

      .form-footer {
        text-align: center;

        margin-top: 20px;

        color: #6c757d;

        font-size: 14px;
      }

      /* ================================
           Mobile Responsive
        ================================= */

      @media (max-width: 576px) {
        .main-container {
          margin: 20px 10px;
        }

        .page-header {
          padding: 25px 15px;
        }

        .form-container {
          padding: 20px;
        }

        .form-section {
          padding: 18px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================================
         MAIN CONTAINER
    ========================================== -->

    <div class="container main-container">
      <!-- =====================================
             PAGE HEADER
        ====================================== -->

      <div class="page-header">
        <h1>Add iPhone Product</h1>

        <p>Enter the product information below</p>
      </div>

      <!-- =====================================
             FORM CONTAINER
        ====================================== -->

      <div class="form-container">
        <!-- =================================
                 FORM

                 IMPORTANT:
                 This sends POST request to
                 your Express server on port 3001.
            ================================== -->

        <form action="http://localhost:3001/add-product" method="POST">
          <!-- =================================
                     PRODUCT INFORMATION
                ================================== -->

          <div class="form-section">
            <h2 class="section-title">Product Information</h2>

            <!-- Product Name -->

            <div class="mb-3">
              <label for="product_name" class="form-label">
                Product Name
                <span class="required">*</span>
              </label>

              <input
                type="text"
                class="form-control"
                id="product_name"
                name="product_name"
                placeholder="Example: iPhone 15 Pro"
                required
              />
            </div>

            <!-- Product URL -->

            <div class="mb-3">
              <label for="product_url" class="form-label">
                Product URL
                <span class="required">*</span>
              </label>

              <input
                type="url"
                class="form-control"
                id="product_url"
                name="product_url"
                placeholder="https://www.apple.com/"
                required
              />
            </div>
          </div>

          <!-- =================================
                     PRODUCT DESCRIPTION
                ================================== -->

          <div class="form-section">
            <h2 class="section-title">Product Description</h2>

            <!-- Brief Description -->

            <div class="mb-3">
              <label for="product_brief_description" class="form-label">
                Brief Description
                <span class="required">*</span>
              </label>

              <textarea
                class="form-control"
                id="product_brief_description"
                name="product_brief_description"
                placeholder="Enter a short description of the product..."
                required
              ></textarea>
            </div>

            <!-- Full Description -->

            <div class="mb-3">
              <label for="product_description" class="form-label">
                Product Description
                <span class="required">*</span>
              </label>

              <textarea
                class="form-control"
                id="product_description"
                name="product_description"
                placeholder="Enter the complete product description..."
                required
              ></textarea>
            </div>

            <!-- Product Image -->

            <div class="mb-3">
              <label for="product_img" class="form-label">
                Product Image URL
                <span class="required">*</span>
              </label>

              <input
                type="url"
                class="form-control"
                id="product_img"
                name="product_img"
                placeholder="https://example.com/iphone.jpg"
                required
              />
            </div>

            <!-- Product Link -->

            <div class="mb-3">
              <label for="product_link" class="form-label">
                Product Link URL
                <span class="required">*</span>
              </label>

              <input
                type="url"
                class="form-control"
                id="product_link"
                name="product_link"
                placeholder="https://www.apple.com/iphone/"
                required
              />
            </div>
          </div>

          <!-- =================================
                     PRODUCT PRICE
                ================================== -->

          <div class="form-section">
            <h2 class="section-title">Product Price</h2>

            <div class="row">
              <!-- Starting Price -->

              <div class="col-md-6 mb-3">
                <label for="starting_price" class="form-label">
                  Starting Price
                  <span class="required">*</span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="starting_price"
                  name="starting_price"
                  placeholder="Example: $999"
                  required
                />
              </div>

              <!-- Price Range -->

              <div class="col-md-6 mb-3">
                <label for="price_range" class="form-label">
                  Price Range
                  <span class="required">*</span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="price_range"
                  name="price_range"
                  placeholder="Example: $999 - $1299"
                  required
                />
              </div>
            </div>
          </div>

          <!-- =================================
                     SUBMIT BUTTON
                ================================== -->

          <div class="mt-4">
            <button type="submit" class="btn btn-primary submit-btn">
              Add Product
            </button>
          </div>

          <!-- =================================
                     FOOTER
                ================================== -->

          <div class="form-footer">
            <p>
              Fields marked with
              <span class="required">*</span>
              are required.
            </p>
          </div>
        </form>
      </div>
    </div>

    <!-- =========================================
         Bootstrap JavaScript
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
