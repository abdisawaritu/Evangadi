<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>

    <label for="graduationMonth"> Graduation Month </label>

    <input type="month" id="graduationMonth" name="graduationMonth" />

    <label for="appointment"> Appointment </label>

    <input type="datetime-local" id="appointment" name="appointment" />
    <form>
      <label for="time">Preferred Time</label>

      <input type="time" id="time" name="time" />
      <label for="firstName">First Name</label>

      <input
        type="text"
        id="firstName"
        name="firstName"
        placeholder="Enter your first name"
        value=""
        required="true"
      />
      <br />
      <br />
      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="example@gmail.com"
        required
      />
      <br />

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
      />
      <br />
      <br />

      <label for="age">Age</label>

      <input type="number" id="age" name="age" min="1" max="120" required />

      <label for="phone">Phone Number</label>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="+251 9XX XXX XXX"
        required
      />

      <label for="website">Website</label>

      <input
        type="url"
        id="website"
        name="website"
        placeholder="https://example.com"
      />

      <label for="search">Search Students</label>

      <input
        type="search"
        id="search"
        name="search"
        placeholder="Search students..."
      />

      <label for="birthDate">Date of Birth</label>

      <input type="date" id="birthDate" name="birthDate" required />

      <label for="week">Academic Week</label>

      <input type="week" id="week" name="week" />

      <p>Gender</p>

      <label>
        <input type="radio" name="gender" value="male" />
        Male
      </label>

      <label>
        <input type="radio" name="gender" value="female" />
        Female
      </label>

      <p>Interests</p>

      <label>
        <input type="checkbox" name="interest" value="programming" />
        Programming
      </label>

      <label>
        <input type="checkbox" name="interest" value="networking" />
        Networking
      </label>

      <label>
        <input type="checkbox" name="interest" value="AI" />
        Artificial Intelligence
      </label>

      <label for="photo">Student Photo</label>

      <input type="file" id="photo" name="photo" accept="image/*" />

      <label for="color">Favorite Color</label>

      <input type="color" id="color" name="color" /> <br />
      <br />

      <label for="experience"> Programming Experience </label>

      <input
        type="range"
        id="experience"
        name="experience"
        min="0"
        max="10"
        value="5"
      />

      <input type="hidden" name="formVersion" value="1" />

      <input type="submit" value="Register" />

      <input type="reset" value="Clear" />

      <input type="button" value="Click Me" />

      <button type="button">Click Me</button>

      <button type="submit">Register</button>

      <select>
        <option>Computer Engineering</option>
        <option>Electrical Engineering</option>
        <option>Software Engineering</option>
      </select>

      <select name="program">
        <optgroup label="Engineering">
          <option value="ce">Computer Engineering</option>

          <option value="ee">Electrical Engineering</option>

          <option value="me">Mechanical Engineering</option>
        </optgroup>

        <optgroup label="Business">
          <option value="accounting">Accounting</option>

          <option value="marketing">Marketing</option>
        </optgroup>
      </select>

      <label for="interests"> Areas of Interest </label>

      <select id="interests" name="interests" multiple>
        <option value="web">Web Development</option>

        <option value="ai">Artificial Intelligence</option>

        <option value="networking">Networking</option>

        <option value="embedded">Embedded Systems</option>
      </select>

      <label for="address">Address</label>

      <textarea
        id="address"
        name="address"
        rows="4"
        cols="30"
        placeholder="Enter your address"
      ></textarea>

      <button type="submit">Register</button>
      <button type="reset">Clear</button>

      <fieldset>
        <input type="text" name="firstName" />
        <input type="text" name="lastName" />
      </fieldset>

      <fieldset>
        <legend>Personal Information</legend>

        <label>First Name</label>
        <input type="text" />

        <label>Last Name</label>
        <input type="text" />
      </fieldset>
    </form>
  </body>
</html>
