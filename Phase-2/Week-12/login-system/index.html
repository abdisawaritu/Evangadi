<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Student Portal login system" />

    <title>Student Portal | Login</title>

    <link rel="stylesheet" href="css/style.css" />

    <!-- Information about the page  -->
  </head>

  <body>
    <!-- Everything visible on the webpage  -->
    <!-- Header / Branding -->
    <header class="site-header">
      <div class="logo">
        <a href="#">Student Portal</a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="login-page">
      <section class="login-container">
        <!-- Login Introduction -->
        <div class="login-header">
          <h1>Welcome Back</h1>
          <p>Sign in to your student account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form">
          <!-- Email -->
          <div class="form-group">
            <label for="email">Email Address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />

            <small
              id="emailError"
              class="error-message"
              aria-live="polite"
            ></small>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="Show password"
              >
                Show
              </button>
            </div>

            <small
              id="passwordError"
              class="error-message"
              aria-live="polite"
            ></small>
          </div>

          <!-- Login Options -->
          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" name="rememberMe" />

              <span>Remember me</span>
            </label>

            <a href="#" class="forgot-password"> Forgot password? </a>
          </div>

          <!-- General Form Message -->
          <div id="formMessage" class="form-message" aria-live="polite"></div>

          <!-- Login Button -->
          <button type="submit" id="loginButton" class="login-button">
            Login
          </button>
        </form>

        <!-- Registration Link -->
        <div class="register-section">
          <p>
            Don't have an account?
            <a href="#" class="register-link"> Create an account </a>
          </p>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
  </body>
</html>
